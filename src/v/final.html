<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4358ef">
<title>Топперы для кофейни</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#4358ef;--surface:#3849d8;--deep:#2f3fc4;--ink:#fff;--muted:#e3e7ff;--line:rgba(255,255,255,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top .wrap{padding-top:20px;padding-bottom:10px;display:flex;align-items:center;justify-content:flex-start;gap:12px}
.logo{height:clamp(64px,17vw,100px);width:auto;display:block}
.call{font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;padding:12px 4px}
.call:hover{opacity:.8}
.hero{padding:18px 0 8px}
h1{font:800 clamp(28px,6.6vw,48px)/1.08 Montserrat,system-ui,sans-serif;margin:0 0 12px;letter-spacing:-.02em;max-width:22ch}
.lead-p{margin:0 0 18px;max-width:54ch;font-size:17px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.facts li{border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.phw{position:relative;padding:14px 14px 0}.ph{aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--deep);position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.28)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:10px;bottom:-4px;background:#fff;color:var(--bg);font-weight:800;font-size:15px;line-height:1;padding:8px 12px 8px 22px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:11px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--bg)}
.tag small{font-weight:600;font-size:11px;margin-left:2px}
.b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
h3{margin:0;font:800 17px/1.2 Montserrat,sans-serif}
.time{font-size:13px;color:var(--muted);font-weight:600}
.tr{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.tr div{background:var(--deep);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.tr b{display:block;color:#fff;font-size:14px;font-weight:800}
.sub{font-size:13px;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border:0;color:inherit;transition:background-color .15s,opacity .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.add,.bar button,.wa{background:#fff;color:var(--bg);font-weight:800}
.add{margin-top:auto;border-radius:12px;padding:12px 8px;font-size:14px;min-height:44px}
.add:hover,.bar button:hover,.wa:hover{opacity:.9}
.qty{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--deep);border-radius:12px;padding:4px}
.qty button{width:44px;height:40px;border-radius:9px;background:rgba(255,255,255,.14);font-size:20px;font-weight:800}
.qty button:hover{background:rgba(255,255,255,.24)}
.qty span{font-weight:800}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.4);padding:0;position:relative}
.dot::after{content:"";position:absolute;inset:-7px}
.dot.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px #fff}
.cn{font-size:13px;font-weight:700}
.sub.warn,#warn{color:#fff;font-weight:800}#warn{font-size:13px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none;z-index:20}
.bar.on{display:block}
.bar button{width:100%;max-width:1008px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:14px 18px;min-height:48px}
.ov{position:fixed;inset:0;background:rgba(14,20,80,.65);display:none;z-index:30}.ov.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font:800 20px Montserrat,sans-serif;display:flex;justify-content:space-between;align-items:center}
.x{background:rgba(255,255,255,.14);width:44px;height:44px;border-radius:50%;font-size:18px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.row b{display:block;font-size:15px}.row small{color:var(--muted);font-weight:600}
.row .qty{margin:0;gap:4px}.row .qty button{width:36px;height:34px;font-size:17px}.row .qty span{min-width:46px;text-align:center;font-size:14px}
.mini{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.5);margin-right:5px;vertical-align:-1px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0;border-top:2px solid #fff}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--deep);color:#fff}
.wa{display:block;text-align:center;margin-top:14px;text-decoration:none;border-radius:14px;padding:15px}
.wa.off{opacity:.4;pointer-events:none}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;text-align:center}
footer{margin-top:34px;padding:22px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer b{color:#fff}footer a{color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cust{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.85}.leads{font-size:14px;color:var(--muted);padding:12px 0 4px;line-height:1.6}.leads b{color:#fff}.rp{width:52px;height:52px;border-radius:50%;background:var(--deep);overflow:hidden;display:flex;align-items:center;justify-content:center}.rp img{width:100%;height:100%;object-fit:cover}.rp i{font-style:normal;font-size:24px;font-weight:800}
.herorow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}.herotxt{flex:1 1 380px;min-width:0}
</style>
</head>

  {id:"custom",name:"Заказать свою модель",def:"Белый",custom:true,noPrice:true,minQty:100,step:50,leadTimes:[{from:1,text:"согласуем после макета"}]}
];
// ================================================
const $=s=>document.querySelector(s),cart={},sel={};
const fmt=n=>n.toLocaleString("ru-RU").replace(/\u00a0/g," ")+" "+CONFIG.currency;
const tiersOf=m=>m.tiers||CONFIG.tiers,colorsOf=m=>m.colors||CONFIG.colors,leadsOf=m=>m.leadTimes||CONFIG.leadTimes;
const minOf=m=>m.minQty||CONFIG.minQty,stepOf=m=>m.step||CONFIG.step;
const pick=(arr,q)=>{let r=arr[0];arr.forEach(t=>{if(q>=t.from)r=t});return r};
const unit=(m,q)=>pick(tiersOf(m),q).price,lead=(m,q)=>pick(leadsOf(m),q).text;
const byId=id=>MODELS.find(m=>m.id===id),key=(id,i)=>id+"|"+i;
const lines=()=>Object.keys(cart).map(k=>{const [id,ci]=k.split("|");return{k,m:byId(id),ci:+ci,q:cart[k]}});
const total=id=>lines().filter(l=>l.m.id===id).reduce((s,l)=>s+l.q,0);
const bad=()=>MODELS.filter(m=>{const T=total(m.id);return T&&T<minOf(m)});
MODELS.forEach(m=>{const i=colorsOf(m).findIndex(c=>c.n===m.def);sel[m.id]=i<0?0:i});
$("#brand").textContent=CONFIG.brand;$("#tag").textContent=CONFIG.tagline;
function card(m){const k=key(m.id,sel[m.id]),q=cart[k]||0,T=total(m.id),t=tiersOf(m),cs=colorsOf(m),mn=minOf(m),addQ=Math.max(stepOf(m),mn-T),ok=!T||T>=mn;
const ph=m.custom?`<div class="ph"><div class="cust"><svg viewBox="0 0 48 48" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M24 8v32M8 24h32"/></svg></div></div><span class="tag">Цена по запросу</span>`:`<div class="ph"><img src="${m.img}" alt="${m.name}, топпер на крышке стакана"></div><span class="tag">${fmt(t[0].price)}<small>/шт</small></span>`;
const info=m.custom?`<div class="time">Принесите логотип или персонажа, напечатаем по вашему макету. От ${mn} шт, шаг ${stepOf(m)} шт.</div>`:`<div class="tr" style="--n:${t.length}">${t.map(x=>`<div>от ${x.from} шт<b>${fmt(x.price)}</b></div>`).join("")}</div>`;
const note=!T?"":!ok?`Минимум ${mn} шт, добавьте ещё ${mn-T}`:m.custom?`В заказе ${T} шт, цену назовём после макета`:`В заказе ${T} шт · ${fmt(unit(m,T))}/шт`;
return `<article class="card"><div class="phw">${ph}</div><div class="b"><h3>${m.name}</h3>${info}
${m.custom?"":`<div class="sw" role="group" aria-label="Цвет">${cs.map((c,i)=>`<button class="dot${i===sel[m.id]?" on":""}" style="--c:${c.c}" data-a="col" data-id="${m.id}" data-i="${i}" aria-label="${c.n}" aria-pressed="${i===sel[m.id]}" title="${c.n}"></button>`).join("")}</div><div class="cn">Цвет: ${cs[sel[m.id]].n}</div>`}
${q?`<div class="qty"><button data-a="dec" data-k="${k}" aria-label="Меньше">−</button><span>${q} шт</span><button data-a="inc" data-k="${k}" aria-label="Больше">+</button></div>`:`<button class="add" data-a="add" data-k="${k}">Добавить ${addQ} шт</button>`}
${note?`<div class="sub${ok?"":" warn"}">${note}</div>`:""}</div></article>`}
function msg(){let s="Здравствуйте! Хочу заказать топперы:\n",tot=0,n=0,cu=false;
MODELS.forEach(m=>{const L=lines().filter(l=>l.m.id===m.id);if(!L.length)return;const T=total(m.id),u=m.noPrice?0:unit(m,T);
if(m.noPrice){cu=true;s+=`${++n}. ${m.name}: ${T} шт (цена и срок после согласования макета)\n`}
else{tot+=u*T;s+=`${++n}. ${m.name}: ${T} шт × ${fmt(u)} = ${fmt(u*T)} (срок ${lead(m,T)})\n`}
s+=m.custom?"":L.map(l=>`   - ${colorsOf(m)[l.ci].n}: ${l.q} шт`).join("\n")+"\n"});
s+=`\nИтого: ${fmt(tot)}`+(cu?" (без своей модели)":"");const c=$("#cafe").value.trim(),nt=$("#note").value.trim();
if(c)s+=`\nКофейня: ${c}`;if(nt)s+=`\nКомментарий: ${nt}`;return s}
function render(){
$("#grid").innerHTML=MODELS.map(card).join("");
const L=lines();let tot=0,cnt=0;
$("#list").innerHTML=L.map(l=>{const T=total(l.m.id),u=l.m.noPrice?0:unit(l.m,T),c=colorsOf(l.m)[l.ci];if(!l.m.noPrice)tot+=u*l.q;cnt+=l.q;
return `<div class="row"><div class="rp">${l.m.img?`<img src="${l.m.img}" alt="">`:`<i>+</i>`}</div><div><b>${l.m.name}</b><small>${l.m.custom?"":`<i class="mini" style="--c:${c.c}"></i>${c.n} · `}${l.m.noPrice?"цена по запросу":fmt(u*l.q)}</small></div><div class="qty"><button data-a="dec" data-k="${l.k}" aria-label="Меньше">−</button><span>${l.q} шт</span><button data-a="inc" data-k="${l.k}" aria-label="Больше">+</button></div></div>`}).join("");
const ls=MODELS.filter(m=>total(m.id)>0).map(m=>({n:m.name,t:lead(m,total(m.id)),np:m.noPrice})),same=ls.length&&ls.every(x=>x.t===ls[0].t);
$("#leads").innerHTML=!ls.length?"":(same?`<b>Срок изготовления:</b> ${ls[0].t}`:`<b>Срок изготовления:</b><br>`+ls.map(x=>`${x.n}: ${x.t}`).join("<br>"))+(ls.some(x=>x.np)?`<br>Цену своей модели назовём после согласования макета.`:"");
$("#total").textContent=fmt(tot);
$("#bar").classList.toggle("on",L.length>0);
$("#barL").textContent=`Корзина: ${cnt} шт`;$("#barR").textContent=fmt(tot);
if(!L.length)$("#ov").classList.remove("on");
const b=bad();$("#warn").textContent=b.length?`Не хватает до минимума: ${b.map(m=>`${m.name} (от ${minOf(m)} шт)`).join(", ")}`:"";
$("#wa").classList.toggle("off",b.length>0);
$("#wa").href=b.length?"#":`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg())}`}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a;
if(a==="col"){sel[b.dataset.id]=+b.dataset.i;return render()}
const k=b.dataset.k,m=byId(k.split("|")[0]),q=cart[k]||0,T=total(m.id),st=stepOf(m);
if(a==="add")cart[k]=Math.max(st,minOf(m)-T);
if(a==="inc")cart[k]=q+st;
if(a==="dec"){const nq=q-st;if(nq<=0||(T===q&&T-st<minOf(m)))delete cart[k];else cart[k]=nq}
render()});
$("#openCart").onclick=()=>$("#ov").classList.add("on");
$("#close").onclick=()=>$("#ov").classList.remove("on");
$("#ov").onclick=e=>{if(e.target.id==="ov")$("#ov").classList.remove("on")};
$("#cafe").oninput=$("#note").oninput=render;
render();
</script>
</body>
